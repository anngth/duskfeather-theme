name: publish

# Push a tag like v1.0.1 to publish. Uses Trusted Publishing (OIDC) on both the
# VS Code Marketplace and Open VSX, so no token secret is needed. Each registry's
# trusted publisher entry must name this file.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag matches package.json version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')"
      - run: node scripts/check.js
      - run: npx --yes @vscode/vsce package -o duskfeather.vsix
      - name: VS Code Marketplace
        run: npx --yes @vscode/vsce publish --oidc --packagePath duskfeather.vsix --skip-duplicate
      # Open VSX only accepts a trusted publisher after a first version exists,
      # so this step stays off until the repository variable is set to true.
      - name: Open VSX
        if: vars.OPENVSX_TRUSTED_PUBLISHING == 'true'
        run: npx --yes ovsx publish --packagePath duskfeather.vsix --trusted-publishing --skip-duplicate
